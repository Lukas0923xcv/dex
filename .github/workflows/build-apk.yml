name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Data & Build Client
        run: |
          # 1. Daten kompilieren, falls noch nicht vorhanden
          if [ ! -f "data/pokemon-data.json" ]; then
            npm run compile:data
          fi

          # 2. Client bauen
          cd client
          npm install
          mkdir -p src/data
          cp ../data/pokemon-data.json src/data/pokemon-data.json
          npm run build

      - name: Setup Capacitor & Build APK
        run: |
          cd client
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor Konfiguration erstellen
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.lukas.pogodex",
            "appName": "PoGo Dex",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
