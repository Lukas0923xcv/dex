
name: Build Android APK

on:
  workflow_dispatch: # Erlaubt manuellen Start per Klick

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Build Client
        run: |
          cd client
          npm ci
          # Pokémon-Daten für den Build kopieren
          cp ../data/pokemon-data.json ./src/data/pokemon-data.json
          npm run build

      - name: Setup Capacitor & Build APK
        run: |
          cd client
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PoGo Dex" "com.lukas.pogodex" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
