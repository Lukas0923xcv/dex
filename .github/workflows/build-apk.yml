name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Data & Build Client
        run: |
          if [ ! -f "data/pokemon-data.json" ]; then
            npm run compile:data
          fi
          cd client
          npm install
          mkdir -p src/data
          cp ../data/pokemon-data.json src/data/pokemon-data.json
          npm run build

      - name: Setup Capacitor & Build APK
        run: |
          cd client
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.lukas.pogodex",
            "appName": "PoGo Dex",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
