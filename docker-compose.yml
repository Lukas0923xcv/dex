services:
  dex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pogo-dex
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pogo-dex-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    command: tunnel run
    depends_on:
      - dex

